<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EchoMind -- trasforma documenti e audio in grafi di conoscenza interattivi."
    />
    <title>EchoMind</title>
    <!--
      Anti-FOUC (Flash Of Unstyled/Wrong-Theme Content): applica il tema
      salvato nel localStorage PRIMA che React si monti, cosi' non c'e'
      alcun lampeggio da light a dark al caricamento della pagina.
      La chiave "echomind_theme" deve essere la stessa di useTheme.ts.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("echomind_theme") || "dark";
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>

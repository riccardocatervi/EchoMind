# =============================================================================
# Alembic — configurazione statica
#
# La URL del DB NON è qui dentro: viene letta da env.py via Pydantic Settings,
# così niente segreti/connection-string nel file committato.
#
# Riferimento ufficiale: https://alembic.sqlalchemy.org/en/latest/tutorial.html
# =============================================================================

[alembic]
# Path della cartella migration (relativo a backend/)
script_location = alembic

# Convenzione: file numerati progressivi (0001_, 0002_, ...) invece di
# nomi random tipo "ab12cd34". Leggibile in git log.
file_template = %%(rev)s_%%(slug)s

# Timezone per i timestamp generati nei file migration
timezone = UTC

# Path da aggiungere a sys.path quando Alembic gira (per importare echomind.*)
prepend_sys_path = ./src

# -----------------------------------------------------------------------------
# Logging — output di Alembic (separato da quello applicativo structlog)
# -----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

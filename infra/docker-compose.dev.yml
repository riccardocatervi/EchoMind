# =============================================================================
# EchoMind — Infrastruttura locale per sviluppo.
#
# Avvio: `make infra-up` (root del repo)
# Note:
#   - Le credenziali sono lette da .env (vedi .env.example)
#   - Tutti i servizi hanno healthcheck → `--wait` aspetta lo stato "healthy"
#   - Volumi named: i dati persistono tra `down`/`up`. Per reset: `make infra-reset`
#
# Versione del file Compose: il campo `version:` è deprecato dalla v2 di
# docker compose, quindi non lo dichiariamo. La compatibilità è garantita.
# =============================================================================

name: echomind-dev

# -----------------------------------------------------------------------------
# Network dedicato. Default `bridge` funziona, ma una rete con nome esplicito
# rende leggibili i log e i `docker network inspect`. Senza una rete dedicata, i
# container non si vedono tra loro.
# -----------------------------------------------------------------------------
networks:
  echomind:
    driver: bridge

# -----------------------------------------------------------------------------
# Volumi named per persistenza dati. Indirizzo file: gestito da Docker stesso
# -----------------------------------------------------------------------------
volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  neo4j-data:

services:
  # ---------------------------------------------------------------------------
  # POSTGRES — database relazionale principale (utenti, documenti, task log).
  # In produzione: Supabase (managed PostgreSQL con auth e RLS integrati, pgvector
  # incluso). In dev: pgvector/pgvector:pg16 = Postgres 16 + estensione pgvector,
  # necessaria per gli embeddings di M5 (CREATE EXTENSION vector nella migration).
  # NB: passando dall'immagine alpine a questa, conviene `make infra-reset` (il
  # volume e' dati dev usa-e-getta) per ripartire pulito.
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: echomind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-echomind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-echomind_dev}
      POSTGRES_DB: ${POSTGRES_DB:-echomind}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Script di bootstrap eseguiti al PRIMO avvio (volume vuoto).
      # Vedi: postgres-init/01_dev_role_setup.sql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - echomind
    healthcheck:
      # pg_isready ritorna 0 quando il server accetta connessioni
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-echomind} -d ${POSTGRES_DB:-echomind}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # RABBITMQ — message broker per Celery (job queue async).
  # Variante "management": include la web UI su porta 15672 (utile per debug:
  # vedere code, message rate, consumer attivi, dead-letter).
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: echomind-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"        # AMQP
      - "${RABBITMQ_MGMT_PORT:-15672}:15672" # Management UI (http)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - echomind
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s  # rabbitmq impiega ~10s ad avviarsi

  # ---------------------------------------------------------------------------
  # REDIS — task state backend per Celery + cache applicativa.
  # `--appendonly yes`: persistenza AOF (append-only file). Senza, ogni
  # restart perde lo stato dei task in esecuzione.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: echomind-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - echomind
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # ---------------------------------------------------------------------------
  # NEO4J — knowledge graph (M5): nodi :Entity + relazioni, prodotti dalla
  # KnowledgeExtraction. In produzione: Neo4j AuraDB (free tier). In dev: Neo4j 5
  # community edition.
  # Plugin GDS NON necessario: la community detection (Louvain) gira in-process
  # con networkx lato applicazione, portabile anche su AuraDB free (rischio R3).
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: echomind-neo4j
    restart: unless-stopped
    environment:
      # NEO4J_AUTH = utente/password. La password DEVE essere >= 8 caratteri
      # (vincolo Neo4j 5). E' la STESSA che l'app legge via NEO4J_PASSWORD: il
      # default qui e nei Settings coincide cosi' dev funziona senza configurare.
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-echomind_dev}
      # Memoria contenuta: sufficiente per il volume dev/MVP, gentile col laptop.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # Neo4j Browser (http)
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # protocollo Bolt (driver)
    volumes:
      - neo4j-data:/data
    networks:
      - echomind
    healthcheck:
      # cypher-shell e' incluso nell'immagine: verifica che il DB accetti query
      # (l'equivalente di pg_isready). La password e' interpolata da compose.
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-echomind_dev} 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s  # neo4j impiega ~20-30s al primo avvio

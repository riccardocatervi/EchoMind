# =============================================================================
# Gitleaks — configurazione custom per EchoMind
#
# Estende le regole built-in con un allowlist che esclude:
#   - i file di test del backend (contengono SOLO secret hardcoded fittizi)
#   - i workflow CI di GitHub (env var di test dummy passate ai run pytest)
#
# Documentazione: https://github.com/gitleaks/gitleaks#configuration
# =============================================================================

title = "EchoMind gitleaks config"

# Carica TUTTE le regole built-in di gitleaks prima di applicare il nostro
# allowlist. Senza questo, le regole base non si attiverebbero.
[extend]
useDefault = true

# -----------------------------------------------------------------------------
# Allowlist globale — esclude path interi
# -----------------------------------------------------------------------------
# Pattern path-based: tutto quello che vive nei test o nei workflow CI viene
# considerato "safe" perché contiene solo segreti dummy hardcoded per la
# test suite. Stringa lunga, alta entropy, ma NESSUNA credenziale reale.
[allowlist]
description = "Test fixtures and CI dummy secrets — not real credentials"
paths = [
    '''backend/tests/.*''',
    '''\.github/workflows/.*''',
]
